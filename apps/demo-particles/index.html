<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particle System Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #gameCanvas {
        display: block;
        cursor: crosshair;
      }
      .controls {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 100;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .controls button {
        padding: 10px 20px;
        border: 2px solid rgba(255,255,255,0.3);
        background: rgba(0,0,0,0.7);
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      }
      .controls button:hover {
        background: rgba(255,255,255,0.1);
        border-color: rgba(255,255,255,0.5);
      }
      .controls button.active {
        background: rgba(255,255,255,0.2);
        border-color: #fff;
      }
      .title {
        position: fixed;
        top: 16px;
        right: 16px;
        color: rgba(255,255,255,0.5);
        font-size: 13px;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>
    <div class="controls">
      <button id="btn-fire" class="active">🔥 Fire</button>
      <button id="btn-smoke">💨 Smoke</button>
      <button id="btn-explosion">💥 Explosion</button>
      <button id="btn-magic">✨ Magic</button>
      <button id="btn-spark">⚡ Spark</button>
      <button id="btn-snow">❄️ Snow</button>
      <button id="btn-clear">🗑️ Clear</button>
    </div>
    <div class="title">Click anywhere to create particle emitters</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
