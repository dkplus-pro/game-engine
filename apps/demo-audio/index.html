<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Engine Demo - Audio</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #0f0f23;
        font-family: system-ui, sans-serif;
        color: #e0e0e0;
      }
      h1 { margin-bottom: 10px; font-size: 1.5rem; }
      p { margin: 0; font-size: 0.875rem; color: #808080; }
      canvas { margin-top: 20px; border: 1px solid #333; }
      .controls { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
      button { padding: 8px 16px; background: #e94560; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.875rem; }
      button:hover { background: #c73e54; }
      button.secondary { background: #1e3a5f; }
      button.secondary:hover { background: #2a4a7f; }
      input[type="range"]="range" { width: 120px; }
      label { display: flex; align-items: center; gap: 6px; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <h1>ECS Game Engine — Audio Demo</h1>
    <p>Click "Load & Play Music" to start. Use buttons to trigger SFX.</p>
    <div class="controls">
      <button id="btn-music">Load & Play Music</button>
      <button id="btn-sfx" class="secondary">Play SFX</button>
      <button id="btn-stop" class="secondary">Stop Music</button>
      <label>Vol: <input type="range" id="volume" min="0" max="100" value="80" /></label>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
