<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Behavior System Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0a;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      #gameCanvas {
        display: block;
        cursor: crosshair;
      }
      .controls {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 100;
        background: rgba(0,0,0,0.7);
        padding: 16px;
        border-radius: 8px;
        color: #fff;
        font-size: 13px;
        line-height: 1.8;
        max-width: 300px;
      }
      .controls strong {
        color: #4dabf7;
        display: block;
        margin-bottom: 8px;
        font-size: 15px;
      }
      .status {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 100;
        background: rgba(0,0,0,0.7);
        padding: 12px 16px;
        border-radius: 8px;
        color: #fff;
        font-size: 13px;
        font-family: monospace;
      }
      .health-bar {
        width: 100px;
        height: 6px;
        background: #333;
        border-radius: 3px;
        overflow: hidden;
        display: inline-block;
        vertical-align: middle;
        margin-left: 8px;
      }
      .health-fill {
        height: 100%;
        background: #40c057;
        transition: width 0.2s;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>
    <div class="controls">
      <strong>🎮 Platformer with Behavior System</strong>
      <div>← → / A D : Move</div>
      <div>↑ / W / Space : Jump</div>
      <div>Land on platforms to navigate</div>
      <div>Avoid red enemies!</div>
    </div>
    <div class="status">
      <div>HP: <span id="hp-value">100</span><div class="health-bar"><div class="health-fill" id="health-fill"></div></div></div>
      <div>Pos: <span id="pos-value">--</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
